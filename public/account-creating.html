<style>
        body {
            font-family: 'Noto Sans', sans-serif;
        }
        h1, h2, h3, h4, h5, h6 {
            font-family: 'EB Garamond', serif;
        }
        .material-symbols-outlined {
          font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        /* Custom Organic Animations */
        @keyframes organic-pulse {
            0%, 100% { 
                transform: scale(1); 
                opacity: 0.9; 
                filter: drop-shadow(0 0 8px rgba(2, 54, 37, 0.2));
            }
            50% { 
                transform: scale(1.08); 
                opacity: 1; 
                filter: drop-shadow(0 0 16px rgba(2, 54, 37, 0.4));
            }
        }
        .animate-organic-pulse {
            animation: organic-pulse 2.5s infinite ease-in-out;
        }

        @keyframes progress-fill {
            0% { width: 0%; }
            30% { width: 45%; }
            80% { width: 85%; }
            100% { width: 95%; } /* Simulates waiting for final confirmation */
        }
        .animate-progress-fill {
            animation: progress-fill 4s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        @keyframes shimmer {
            100% { transform: translateX(100%); }
        }
        .animate-shimmer {
            animation: shimmer 1.5s infinite linear;
        }
    </style>
</head>
<body class="bg-background-beige text-on-surface min-h-screen flex items-center justify-center antialiased">
<!-- 
      Semantic Shell Mandate: 
      TopNavBar and Footer are intentionally SUPPRESSED here because this is a 
      linear/transactional "Success/Loading" splash screen. The canvas must 
      be prioritized for the user's focused journey.
    -->
<main class="w-full max-w-sm mx-margin-mobile flex flex-col items-center justify-center p-stack-lg">
<!-- Central Loading Card -->
<div class="bg-surface-cream shadow-[0_8px_32px_rgba(31,77,58,0.06)] rounded-xl p-stack-lg w-full flex flex-col items-center justify-center text-center gap-stack-lg border border-border-sand relative overflow-hidden">
<!-- Subtle background pattern for premium feel -->
<div class="absolute inset-0 opacity-[0.03] pointer-events-none" style="background-image: radial-gradient(circle at 2px 2px, #023625 1px, transparent 0); background-size: 24px 24px;"></div>
<!-- Icon Animation Container -->
<div class="relative w-20 h-20 flex items-center justify-center z-10">
<!-- Soft glow ring -->
<div class="absolute inset-0 rounded-full bg-primary-container/10 animate-organic-pulse"></div>
<!-- Core Icon -->
<span class="material-symbols-outlined text-primary text-5xl relative z-10 animate-organic-pulse" data-icon="energy_savings_leaf" data-weight="fill" style="animation-delay: 0.2s;">
                    energy_savings_leaf
                </span>
</div>
<!-- Text Content -->
<div class="flex flex-col gap-unit z-10">
<h1 class="font-headline-sm text-headline-sm text-primary">আপনার অ্যাকাউন্ট তৈরি করা হচ্ছে...</h1>
<p class="font-body-sm text-body-sm text-muted-gray">অনুগ্রহ করে কিছুক্ষণ অপেক্ষা করুন</p>
</div>
<!-- Progress Bar Container -->
<div class="w-full z-10 flex flex-col gap-unit mt-stack-sm">
<div class="w-full h-1.5 bg-surface-variant rounded-full overflow-hidden relative">
<!-- The filling bar -->
<div class="h-full bg-primary rounded-full animate-progress-fill relative overflow-hidden">
<!-- Shimmer light effect sweeping across the bar -->
<div class="absolute inset-0 w-full h-full bg-gradient-to-r from-transparent via-white/40 to-transparent -translate-x-full animate-shimmer"></div>
</div>
</div>
</div>
</div>

<span class="material-symbols-outlined text-[16px]" data-icon="lock">lock</span>

</div>
