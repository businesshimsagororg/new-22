<body class="min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop bg-background-beige text-on-surface">
<!-- Note: TopNavBar and BottomNavBar are explicitly suppressed here because this is a linear/transactional (Login) page as per the "Destination Rule". -->
<main class="w-full max-w-[480px]">
<!-- Brand Logo / Identity -->
<div class="text-center mb-stack-lg">
<h1 class="font-headline-md text-headline-md font-bold text-primary">PureOrigins</h1>
<p class="font-body-md text-body-md text-muted-gray mt-stack-sm">প্রকৃতির শুদ্ধতা, আপনার ঘরে</p>
</div>
<!-- Login Card -->
<div class="bg-surface-cream rounded-lg shadow-[0_8px_24px_rgba(31,77,58,0.08)] p-stack-lg border border-border-sand/50 transition-shadow duration-300 hover:shadow-[0_12px_32px_rgba(31,77,58,0.12)]">

<form action="#" class="space-y-stack-md" method="POST">
<!-- Email/Phone Field -->
<div>
<label class="block font-body-sm text-body-sm text-on-surface-variant mb-unit" for="identifier">ইমেইল বা মোবাইল নম্বর</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-[20px]">person</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 border-border-sand rounded-lg font-body-md text-body-md text-on-surface bg-surface-cream focus:ring-primary focus:border-primary transition-colors duration-200" id="identifier" name="identifier" placeholder="আপনার ইমেইল বা নম্বর দিন" required="" type="text"/>
</div>
</div>
<!-- Password Field -->
<div>
<div class="flex justify-between items-center mb-unit">
<label class="block font-body-sm text-body-sm text-on-surface-variant" for="password">পাসওয়ার্ড</label>
<a class="font-body-sm text-body-sm text-primary hover:text-primary-container transition-colors duration-200" href="#">পাসওয়ার্ড ভুলে গেছেন?</a>
</div>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-[20px]">lock</span>
</div>
<input class="block w-full pl-10 pr-10 py-3 border-border-sand rounded-lg font-body-md text-body-md text-on-surface bg-surface-cream focus:ring-primary focus:border-primary transition-colors duration-200" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute inset-y-0 right-0 pr-3 flex items-center text-outline hover:text-on-surface-variant transition-colors" onclick="togglePasswordVisibility()" type="button">
<span class="material-symbols-outlined text-[20px]" id="password-toggle-icon">visibility</span>
</button>
</div>
</div>
<!-- Submit Button -->
<div class="pt-stack-sm">
<button class="w-full flex justify-center items-center py-3 px-4 border border-transparent rounded-lg shadow-sm font-body-md text-body-md font-medium text-on-primary bg-primary hover:bg-primary-container hover:-translate-y-[1px] hover:shadow-md active:translate-y-0 active:shadow-sm focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-all duration-200" type="submit">

                    </button>
</div>
</form>

<div aria-hidden="true" class="absolute inset-0 flex items-center">
<div class="w-full border-t border-border-sand"></div>

<div class="relative flex justify-center">

<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>

গুগল দিয়ে চালিয়ে যান
</button>

<p class="font-body-md text-body-md text-on-surface-variant">
                    নতুন একাউন্ট খুলতে চান?

</p>

<script>
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.getElementById('password-toggle-icon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.textContent = 'visibility_off';
            } else {
                passwordInput.type = 'password';
                toggleIcon.textContent = 'visibility';
            }
        }
    </script>
