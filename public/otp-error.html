<script>
        // Simple script to auto-focus next input - vanilla JS micro-interaction
        document.addEventListener('DOMContentLoaded', () => {
            const inputs = document.querySelectorAll('input[type="text"]');
            
            // Focus on the first empty input or the last one if all full
            let focused = false;
            inputs.forEach(input => {
                if(!focused && input.value === '') {
                    input.focus();
                    focused = true;
                }
            });
            if(!focused && inputs.length > 0) inputs[inputs.length - 1].focus();

            inputs.forEach((input, index) => {
                input.addEventListener('input', (e) => {
                    // Reset error state visuals slightly on new input to encourage trying again
                    inputs.forEach(i => {
                        i.classList.remove('border-error', 'ring-error');
                        i.classList.add('border-border-sand', 'focus:border-primary', 'focus:ring-primary');
                    });
                    
                    if(e.target.value.length === 1 && index < inputs.length - 1) {
                        inputs[index + 1].focus();
                    }
                });

                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Backspace' && e.target.value.length === 0 && index > 0) {
                        inputs[index - 1].focus();
                        // Also clear error states on backspace
                        inputs.forEach(i => {
                            i.classList.remove('border-error', 'ring-error');
                            i.classList.add('border-border-sand', 'focus:border-primary', 'focus:ring-primary');
                        });
                    }
                });
            });
        });
    </script>
